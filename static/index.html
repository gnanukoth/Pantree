<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pantree</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --panel: #fffdf8;
      --ink: #1f2a24;
      --muted: #5d6b64;
      --line: #d9d2c5;
      --leaf: #2f6f4e;
      --leaf-dark: #1f4d36;
      --user: #e8f0ea;
      --agent: #fff;
      --reason: #fff6e5;
      --reason-ink: #6a4b16;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    header {
      padding: 16px 20px 8px;
    }
    header h1 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: 0.02em;
    }
    header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 16px;
      padding: 0 20px 20px;
      min-height: calc(100vh - 88px);
    }
    .chat, .side {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .messages {
      height: calc(100vh - 210px);
      overflow-y: auto;
      padding: 16px;
    }
    .msg {
      max-width: 85%;
      margin-bottom: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
    }
    .msg.user {
      margin-left: auto;
      background: var(--user);
    }
    .msg.agent {
      background: var(--agent);
    }
    .msg .who {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--leaf);
      margin-bottom: 4px;
    }
    .reasons {
      margin-top: 8px;
      padding: 8px 10px;
      background: var(--reason);
      color: var(--reason-ink);
      border-radius: 8px;
      font-size: 0.85rem;
    }
    .reasons strong { display: block; margin-bottom: 4px; }
    .reasons li { margin: 2px 0; }
    .composer {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid var(--line);
    }
    .composer input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
    }
    .composer button {
      background: var(--leaf);
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 10px 16px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .composer button:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    .composer button:hover:not(:disabled) { background: var(--leaf-dark); }
    .side {
      padding: 14px;
      overflow-y: auto;
      height: calc(100vh - 120px);
    }
    .side h2 {
      margin: 0 0 8px;
      font-size: 0.95rem;
    }
    .side h3 {
      margin: 14px 0 6px;
      font-size: 0.8rem;
      text-transform: uppercase;
      color: var(--muted);
    }
    .side ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .side li {
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
      font-size: 0.88rem;
    }
    .meta { color: var(--muted); font-size: 0.78rem; }
    .empty { color: var(--muted); font-size: 0.85rem; }
    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; }
      .messages, .side { height: auto; min-height: 280px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Pantree</h1>
    <p>Ask what to cook, log groceries, or set a short-term constraint. Reasoning stays visible under each reply.</p>
  </header>
  <div class="layout">
    <section class="chat">
      <div id="messages" class="messages"></div>
      <form class="composer" id="chat-form">
        <input id="message" type="text" placeholder="what should I cook?" autocomplete="off" required>
        <button type="submit" id="send">Send</button>
      </form>
    </section>
    <aside class="side">
      <h2>Live actions</h2>
      <p class="meta">Polling the database every 3 seconds.</p>
      <h3>Grocery list</h3>
      <ul id="grocery"></ul>
      <h3>Throwaway log</h3>
      <ul id="throwaway"></ul>
    </aside>
  </div>
  <script>
    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("message");
    const send = document.getElementById("send");

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    function addMessage(role, text, reasons) {
      const wrap = el("div", "msg " + role);
      wrap.appendChild(el("div", "who", role === "user" ? "You" : "Pantree"));
      wrap.appendChild(el("div", "", text));
      if (role === "agent") {
        const box = el("div", "reasons");
        box.appendChild(el("strong", "", "Reasoning"));
        if (reasons && reasons.length) {
          const list = el("ul");
          reasons.forEach(function (item) {
            list.appendChild(el("li", "", item));
          });
          box.appendChild(list);
        } else {
          box.appendChild(el("div", "", "No scoring signals for this turn."));
        }
        wrap.appendChild(box);
      }
      messagesEl.appendChild(wrap);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addMessage("user", text);
      input.value = "";
      send.disabled = true;
      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        addMessage("agent", data.reply || "(empty reply)", data.reasons || []);
      } catch (err) {
        addMessage("agent", "Could not reach the chat endpoint.", []);
      } finally {
        send.disabled = false;
        input.focus();
      }
    });

    function renderList(targetId, rows, emptyText) {
      const ul = document.getElementById(targetId);
      ul.innerHTML = "";
      if (!rows || !rows.length) {
        ul.appendChild(el("li", "empty", emptyText));
        return;
      }
      rows.slice(0, 12).forEach(function (row) {
        const li = el("li");
        li.appendChild(el("div", "", row.item || "(unnamed item)"));
        const when = row.timestamp || row.created_at || "";
        li.appendChild(el("div", "meta", (row.reason || "") + (when ? " · " + when : "")));
        ul.appendChild(li);
      });
    }

    async function pollActions() {
      try {
        const res = await fetch("/actions");
        const data = await res.json();
        renderList("grocery", data.grocery_list, "No grocery additions yet.");
        renderList("throwaway", data.throwaway_log, "No throwaway entries yet.");
      } catch (err) {
        renderList("grocery", [], "Could not load grocery list.");
        renderList("throwaway", [], "Could not load throwaway log.");
      }
    }

    pollActions();
    setInterval(pollActions, 3000);
  </script>
</body>
</html>
